<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/6_salsa_bottle/1_salsa_bottle_on_ground.png" type="image/x-icon">
    <title>El pollo loco</title>
</head>

<body > <!-- delete init onload - if start animation is done -->
    <main>
        <header>
            <div class="header-left-section">
                <img class="header-salsa-bottle" src="./img/6_salsa_bottle/salsa_bottle.png" alt="salsa bottle">
            </div>
            <div class="header-right-section">
                <img class="header-coin" src="./img/8_coin/coin_1.png" alt="coin">
                <img class="header-second-coin" src="./img/8_coin/coin_2.png" alt="second coin">
            </div>

        </header>

        <h1>El pollo loco</h1>
        <div id="game-over-screen" class="game-over-screen">
            <img src="./img/" alt="" srcset=""> //implement var overlay
            <button onclick="show('canvas'), hide('game-over-screen'), init()" class="btn-start-game">Restart Game !</button>
        </div>
        <div id="start-screen" class="start-screen">
            <button onclick="show('canvas'), hide('start-screen'), init()" class="btn-start-game">Start Game !</button>
        </div>

        <div id="full-screen">
            <canvas class="hide" id="canvas" width="720" height="480">
            </canvas>
        </div>
        
        <footer>
            <div class="footer-wrapper">
                <a class="footer-text" href="./legal_notice.html">Legal notice</a>
                <div class="footer-seperator"></div>
                <p class="footer-copyright">© 2026 El pollo loco</p>
            </div>
        </footer>

    </main>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/collectible-object.class.js"></script>
    <script src="./models/salsa-bottle.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/small-chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
    <script src="./script.js"></script>
</body>

</html>
